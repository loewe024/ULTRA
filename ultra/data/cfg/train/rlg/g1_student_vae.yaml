params:
  seed: -1

  algo:
    name: ultra

  model:
    name: ultra

  network:
    name: ultra
    separate: True
    disable_double_critic: True

    space:
      continuous:
        mu_activation: None
        sigma_activation: None
        mu_init:
          name: default
        sigma_init:
          name: const_initializer
          val: -2.9
        fixed_sigma: True
        learn_sigma: False

    mlp:
      units: [1024, 1024, 512]
      activation: relu
      d2rl: False

      initializer:
        name: default
      regularizer:
        name: None

    point_cloud:
      enabled: True
      num_points: 64
      point_dim: 3
      raw_obs_dim: 192
      hidden_dim: 256
      output_dim: 256
      projection_dim: 256
    
    modal_config:
      goal_dim: 3
      command_dim: 4
      local_goal_dim: 31
      obj_trans_dim: 3
      obj_rot_dim: 6
      obj_pos_dim: 3
      raw_point_obs_dim: 192
      task_obs_dim: 204
      mask_dim: 242
      token_dim: 256
      fusion_hidden: 512
      transformer_heads: 4
      transformer_layers: 2
      transformer_ffn_dim: 1024
      debug_modal_layout: True
      mask_routing: True

  # load_checkpoint: True
  load_checkpoint: False

  config:
    name: g1_student_vae
    full_experiment_name: g1_student_vae
    env_name: rlgpu
    multi_gpu: False
    ppo: True
    mixed_precision: False
    normalize_input: False
    normalize_value: False
    reward_shaper:
      scale_value: 1
    normalize_advantage: True
    gamma: 0.99
    tau: 0.95
    learning_rate: 2e-4
    lr_schedule: curriculum
    lr_final: 5e-5
    lr_warmup_end: 500
    lr_decay_end: 5500
    score_to_win: 20000
    max_epochs: 1000000
    save_best_after: 500
    save_frequency: 500
    print_stats: True
    grad_norm: 1.0
    entropy_coef: 0.0
    truncate_grads: False
    local_goal_pred_coef: 1.
    ppo: True
    e_clip: 0.2
    horizon_length: 8
    minibatch_size: 4096
    mini_epochs: 2
    critic_coef: 5
    clip_value: False
    seq_len: 4
    bounds_loss_coef: 10
    expert_loss_coef: 1
    aux_loss_coef: 1.
    disable_critic: False
    find_unused_parameters: False
    debug_unused_params: False
    enable_eps_greedy: False
    resume_from: None  # path to a .pth to resume from; None / null = start from scratch
    save_intermediate: True
    vae_dim: 64
